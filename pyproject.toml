[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alsoul"
version = "0.0.1"
description = "Alsoul F4 walking-skeleton implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
]

[project.scripts]
alsoul-host = "alsoul.host.__main__:main"

[project.optional-dependencies]
dev = [
  "alembic>=1.13,<2",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/alsoul"]
